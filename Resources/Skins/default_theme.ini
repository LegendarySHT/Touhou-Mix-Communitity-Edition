# 默认主题配置
# 此文件定义UI主题的配色方案

[Colors]
# 主色调
primary_color = "#FF6B00"
secondary_color = "#004E98"

# 背景色
background_color = "#1A1A2E"
surface_color = "#16213E"

# 文字色
text_primary = "#FFFFFF"
text_secondary = "#CCCCCC"
text_disabled = "#666666"

# 强调色
accent_color = "#FFD60A"
error_color = "#D62828"
success_color = "#07BC0C"

# 状态色
hover_color = "#2A2A4E"
selected_color = "#FF8C00"
disabled_color = "#555555"

[Fonts]
# 默认字体大小
font_size_small = 12
font_size_normal = 16
font_size_large = 24
font_size_title = 32

# 字体路径（相对于Resources/Fonts目录）
font_default = "default.ttf"
font_title = "title.ttf"
font_mono = "mono.ttf"

[UI_Elements]
# 边框宽度
border_width = 2

# 圆角半径
border_radius = 8

# 按钮高度
button_height = 40
button_padding = 10

# 列表项高度
list_item_height = 50
list_item_spacing = 5
