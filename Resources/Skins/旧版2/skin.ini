# 旧版2 内置皮肤配置
# 字段说明：
#   glow_use_custom_color = 光晕是否使用自定义颜色（false=跟随游戏中实际音符颜色，true=使用 glow_custom_color）
#   glow_custom_color     = 自定义光晕颜色（#RRGGBB），仅当 glow_use_custom_color=true 时生效
#   glow_use_custom_size  = 光晕是否使用自定义大小（false=跟随全局光晕大小，true=使用 glow_size）
#   glow_size             = 自定义光晕大小（仅当 glow_use_custom_size=true 时生效；0=关闭光晕，>0=光晕大小）
#   long_f_mode           = 仅 [long] 节：长条中部贴图应用方式（repeat=重复，stretch=竖直拉伸）

[short]
glow_use_custom_color=false
glow_custom_color=#ffffff
glow_use_custom_size=false
glow_size=5.0

[instant]
glow_use_custom_color=false
glow_custom_color=#ffffff
glow_use_custom_size=false
glow_size=5.0

[long]
glow_use_custom_color=false
glow_custom_color=#ffffff
glow_use_custom_size=false
glow_size=8.0
long_f_mode=repeat
