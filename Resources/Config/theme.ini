# ============================================================
# 主题配置文件
# 颜色通过预设方案管理：每个 [preset_*] 定义调色板
# 切换预设用 active_preset 键，或运行时调用 ThemeManager.apply_preset()
#
# 颜色格式：#RRGGBB 或 #RRGGBBAA（含透明度）
# 背景 type：gradient | solid | image
# ============================================================

[Theme]
version = "1.0.0"
# 当前预设：blue | pink | green | yellow
active_preset = "blue"

# ============================================================
# 预设颜色方案（每预设 7 色）
#
# 主色三阶：primary / primary_light(淡) / primary_dark(暗)
#   用于按钮背景、面板、强调元素
# 辅色：secondary
#   用于需要区分主次的次要元素
# 文字三阶：text_primary / text_secondary / text_dim
#   用于标题、正文、禁用/提示文字
#
# 背景色由 ThemeManager 内部根据 primary_dark 自动衍生，不进预设。
# 语义色（danger/success 等）无主题切换需求，代码中写死。
# ============================================================

# --- 蓝色（默认） ---
[preset_blue]
primary = "#2E8BF0"
primary_light = "#5DADFF"
primary_dark = "#154E96"
secondary = "#5A7BC4"
text_primary = "#FFFFFF"
text_secondary = "#8899B0"
text_dim = "#506080"

# --- 粉色 ---
[preset_pink]
primary = "#F05A8A"
primary_light = "#FF88B0"
primary_dark = "#A52A54"
secondary = "#C06090"
text_primary = "#FFFFFF"
text_secondary = "#C0A0B0"
text_dim = "#785060"

# --- 绿色 ---
[preset_green]
primary = "#2EAF5C"
primary_light = "#4FD87E"
primary_dark = "#18783A"
secondary = "#3E9C66"
text_primary = "#FFFFFF"
text_secondary = "#90B8A0"
text_dim = "#487058"

# --- 黄色 ---
[preset_yellow]
primary = "#B8860B"
primary_light = "#C89A2C"
primary_dark = "#96720F"
secondary = "#B8932E"
text_primary = "#FFFFFF"
text_secondary = "#C0B090"
text_dim = "#786048"

# ============================================================
# 背景配置（每个视图独立）
#
# type 可选：
#   gradient — 渐变（默认垂直，可调 fill_from/to 坐标实现斜向）
#   solid    — 纯色
#   image    — 图片（从 BackgroundImage 目录加载）
#   cover    — 封面（仅 play 视图，由 PlayView 自行处理封面 + 模糊烘焙）
#
# gradient 参数：gradient_top/bottom(颜色) + from_x/y to_x/y(UV坐标)
# solid  参数：solid_color(颜色)
# image  参数：image_path(文件名) + image_stretch(cover|scale|tile|center|keep)
# cover  参数：cover_blur(0.0-1.0 模糊强度)
# ============================================================
[backgrounds]
# --- 主界面 (gradient 垂直) ---
bg_main_type = "gradient"
bg_main_gradient_top = "#000B2E"
bg_main_gradient_bottom = "#4B3A90"
bg_main_gradient_from_x = 0.0
bg_main_gradient_from_y = 0.0
bg_main_gradient_to_x = 0.0
bg_main_gradient_to_y = 1.0

# --- 商店 (image) ---
bg_store_type = "image"
bg_store_image_path = "nasa-carina-nebula.jpg"
bg_store_image_stretch = "cover"

# --- 结算 (solid) ---
bg_score_type = "solid"
bg_score_solid_color = "#0D1020"

# --- 演奏 (gradient 垂直) ---
bg_play_type = "gradient"
bg_play_gradient_top = "#6334A7"
bg_play_gradient_bottom = "#B55BB5"
bg_play_gradient_from_x = 0.0
bg_play_gradient_from_y = 0.0
bg_play_gradient_to_x = 0.0
bg_play_gradient_to_y = 1.0
# 演奏界面仅在 type=cover 时生效：封面模糊强度（0.0-1.0）
bg_play_cover_blur = 0.35
# 演奏界面仅在 type=image 时生效：背景图片文件名 + 拉伸模式
bg_play_image_path = ""
bg_play_image_stretch = "cover"
# 演奏界面仅在 type=solid 时生效：纯色背景颜色
bg_play_solid_color = "#10121AFF"

# --- 音轨 (gradient 对角线：左下→右上) ---
bg_track_type = "gradient"
bg_track_gradient_top = "#1A2844"
bg_track_gradient_bottom = "#0A0E1A"
bg_track_gradient_from_x = 0.0
bg_track_gradient_from_y = 1.0
bg_track_gradient_to_x = 1.0
bg_track_gradient_to_y = 0.0

# --- 谱面详情 (gradient 垂直) ---
bg_midi_type = "gradient"
bg_midi_gradient_top = "#0D1020"
bg_midi_gradient_bottom = "#0A0F1E"
bg_midi_gradient_from_x = 0.0
bg_midi_gradient_from_y = 0.0
bg_midi_gradient_to_x = 0.0
bg_midi_gradient_to_y = 1.0

# --- 设置 (gradient 垂直) ---
bg_setting_type = "gradient"
bg_setting_gradient_top = "#0D1020"
bg_setting_gradient_bottom = "#0A0F1E"
bg_setting_gradient_from_x = 0.0
bg_setting_gradient_from_y = 0.0
bg_setting_gradient_to_x = 0.0
bg_setting_gradient_to_y = 1.0

# ============================================================
# 字号定义
# ============================================================
[font_sizes]
small = 22
body = 28
medium = 32
large = 40
title = 48
display = 72
