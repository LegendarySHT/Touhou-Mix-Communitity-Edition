# 游戏配置文件
# 此文件定义游戏的基础设置和可扩展配置

[Game]
# 项目名称
project_name = "THMIX Community Version"

# 版本号
version = "1.0.0"

# 支持的难度等级
difficulties = ["Easy", "Normal", "Hard", "Lunatic"]

[Display]
# 默认分辨率
default_width = 1280
default_height = 720

# 是否支持全屏
fullscreen = true

# 垂直同步
vsync_enabled = true

[Audio]
# 默认音量（0-100）
master_volume = 80
music_volume = 80
effects_volume = 80

[UI]
# 主题名称
default_theme = "default"

# 语言
default_language = "zh_CN"

# 支持的语言列表
supported_languages = ["zh_CN", "en_US", "ja_JP"]

[Performance]
# 启用性能监控
enable_profiling = false

# 最大MIDI数量（用于内存优化）
max_midi_cache_size = 500

[Gameplay]
# 起始偏移时间（毫秒）
note_offset = 0

# 判定区间（毫秒）
judge_window_perfect = 50
judge_window_good = 100
judge_window_ok = 150
judge_window_miss = 200
# ========== MIDI相关配置 ==========

# 默认音源文件名（位于Resources/Soundfont/）
soundfont_file = "GeneralUser-GS.sf2"

# MIDI轨道过滤模式
# AUTO: 自动过滤（根据难度自动选择轨道）
# MANUAL: 手动选择（玩家在配置界面选择）
# NONE: 不过滤（使用所有轨道）
track_filter_mode = "MANUAL"

# 最小音符间距（毫秒）-防止键位过于拥挤
min_note_spacing_ms = 10.0

# 是否启用背景序列（伴奏音轨）
enable_background_sequences = true

# 键盘布局配置
keyboard_layout = "default"