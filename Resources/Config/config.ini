# 游戏配置文件
# 此文件定义游戏的基础设置和可扩展配置

[Game]
# 项目名称
project_name = "THMIX Community Version"

# 版本号
version = "1.0.0"

# 配置文件版本（用于兼容性检查）
config_version = "1.0.0"

# 支持的难度等级
difficulties = ["Easy", "Normal", "Hard", "Lunatic"]

[Display]
# 默认分辨率
default_width = 1280
default_height = 720

# 是否支持全屏
fullscreen = true

# 垂直同步
vsync_enabled = true

[Audio]
# 默认音量（0-100）
master_volume = 80
music_volume = 80
effects_volume = 80

[UI]
# 主题名称
default_theme = "default"

# 语言
default_language = "zh_CN"

# 支持的语言列表
supported_languages = ["zh_CN", "en_US", "ja_JP"]

[Performance]
# 启用性能监控
enable_profiling = false

# 最大MIDI数量（用于内存优化）
max_midi_cache_size = 500

[Gameplay]
# 起始偏移时间（毫秒）
note_offset = 0

# ========== MIDI相关配置 ==========

# 默认音源文件名（位于Resources/Soundfont/）
soundfont_file = "GeneralUser-GS.sf2"

# MIDI合成器后端 (addons / meltysynth)
midi_backend = "addons"

# 默认MIDI播放音量（0-100）
default_midi_volume = 50

# 默认人声音量（0-100）
default_vocal_volume = 50

# 音频不同步阈值（毫秒，范围50-500）
audio_sync_threshold = 200

# MIDI轨道过滤模式
# AUTO: 自动过滤（根据难度自动选择轨道）
# MANUAL: 手动选择（玩家在配置界面选择）
# NONE: 不过滤（使用所有轨道）
track_filter_mode = "MANUAL"

# 最小音符间距（毫秒）-防止键位过于拥挤
min_note_spacing_ms = 10.0

# 是否启用背景序列（伴奏音轨）
enable_background_sequences = true

# 键盘布局配置
keyboard_layout = "default"

# ========== 常规设置 (General) ==========
[General]
# 线上模式 (0=关闭, 1=开启)
online_mode = 0

# 显示调试信息 (0=关闭, 1=开启)
display_debug_info = 0

# 语言设置 (0=英文, 1=中文)
language = 1

# 服务器地址
server_address = "thmix.org"

# 重置内置资源 (0=关闭, 1=开启) - 执行后会自动重置为0
reload_builtin_resources = 0

# ========== 播放设置 (Playback) ==========
[Playback]
# 弹奏模式 (0=关闭, 1=开启)
performing_mode = 1

# 自动模式 (0=普通, 1=自动)
auto_mode = 0

# 播放准备动画 (0=关闭, 1=开启)
play_ready_animation = 1

# 播放速度倍率
playback_speed_scaling = 1.0

# 触摸震动反馈 (0=关闭, 1=开启)
vibrate_on_touch = 1

# 震动持续时间（毫秒）
vibration_duration = 20

# 使用系统时钟 (0=关闭, 1=开启)
use_system_stopwatch = 1

# 音频缓冲区大小（索引）- 0=256帧, 1=512帧, 2=1024帧, 3=2048帧
audio_buffer_frames = 2

# 最大复音数 - 同时发声的最大音符数，建议值：32/64/96/128
max_polyphony = 96

# ========== 轨道设置 (Lane) ==========
[Lane]
# 下落轨道数量
lane_count = 12

# 键盘模式 (0=关闭, 1=开启)
keyboard_mode = 0

# 键盘键位设置
keyboard_mode_keys = "A,S,D,F,J,K,L,;"

# 光柱不透明度 (0.0-1.0)
flash_alpha = 0.8

# Perfect特效设定 (0=默认, 1=简单)
perfect_spark_preset = 0

# Perfect特效大小（像素）
perfect_spark_scaling = 50

# Great特效设定 (0=默认, 1=简单)
great_spark_preset = 0

# Great特效大小（像素）
great_spark_scaling = 50

# Good特效设定 (0=默认, 1=简单)
good_spark_preset = 0

# Good特效大小（像素）
good_spark_scaling = 50

# Bad特效设定 (0=默认, 1=简单)
bad_spark_preset = 0

# Bad特效大小（像素）
bad_spark_scaling = 1.0

# ========== 判定设置 (Judge) ==========
[Judge]
# 判定方式 (0=最临近, 1=最佳时机, 2=距判定线最近, 3=最佳时机先进先出)
touch_judging_criteria = 3

# 抬手时判定滑块 (0=关闭, 1=开启)
check_instant_blocks_when_finger_up = 1

# 仅判定完美滑块 (0=关闭, 1=开启)
only_perfect_instant_blocks_before_judge = 0

# 判定线高度（像素）
judge_line_position = 200

# 音符判定宽度（像素）
block_judging_width = 230

# 最小横向音符间距（像素）
min_block_spacing = 50

# 安全区域宽度设定（像素）
canvas_horizontal_padding = 100

# 按键判定延迟偏移（毫秒）
judge_time_offset = 0

# Perfect判定范围（秒）
perfect_time = 0.05

# Great判定范围（秒）
great_time = 0.1

# Good判定范围（秒）
good_time = 0.15

# Bad判定范围（秒）
bad_time = 0.2

# ========== 生成设置 (Generator) ==========
[Generator]
# 生成滑块最大时间（秒）
instant_block_max_time = 0.5

# 生成短块最大时间（秒）
short_block_max_time = 1.0

# 最大并排下落音符
max_simultaneous_blocks = 2

# 连点最小时间间隔（秒）
min_tap_interval = 0.2

# 最小点击冷却时间（秒）
min_touch_cooldown_time = 0.2

# 手指最大移动速度（像素/秒）
max_touch_move_speed = 400

# 每个批次最大时间（秒）
max_block_coalesce_time = 0.1

# 音符下落时间（秒）
note_fall_time = 1

# ========== 外观设置 (Appearance) ==========
[Appearance]
# 随机音符颜色 (0=关闭, 1=开启)
randomize_block_color = 0

# 音符下落模式 (0=匀速, 1=加速下落, 2=自定义)
note_fall_mode = 0

# 音符过判定线后的下落速度倍率 (相对于判定线前，1.0为相同)
note_fall_speed_after_judge_multiplier = 1.0

# 音符过判定线前的缓动函数（用于自定义模式）
note_fall_easing_before_func = LINEAR

# 音符过判定线前的缓动相位（用于自定义模式）
note_fall_easing_before_phase = OUT

# 音符过判定线后的缓动函数（用于自定义模式）
note_fall_easing_after_func = LINEAR

# 音符过判定线后的缓动相位（用于自定义模式）
note_fall_easing_after_phase = IN


# 统一音符颜色 (0=关闭, 1=开启)
sync_color_across_block_type = 0

# 滑块颜色（HTML颜色代码）
instant_block_color = "#FF6B6B"

# 点块颜色（HTML颜色代码）
short_block_color = "#4ECDC4"

# 长条颜色（HTML颜色代码）
long_block_color = "#45B7D1"

# 皮肤纹理过滤模式 (0=Nearest, 1=Bilinear)
custom_block_skin_texture_filter_mode = 0

# 音符外观设定 (0=默认, 1=简单)
block_skin_preset = 0

# 背景尺寸模式 (0=覆盖, 1=适应)
custom_background_image_size_mode = 0

# 游玩背景模式 (0=封面, 1=图片, 2=纯色)
play_background_mode = 0

# 封面背景模糊强度 (0.0-1.0)
play_background_cover_blur = 0.35

# 游玩背景尺寸模式 (0=覆盖, 1=拉伸)
play_background_size_mode = 0

# 游玩背景图片文件名（位于 user://files/BackgroundImage/）
play_background_image_file = ""

# 游玩纯色背景颜色（RGBA）
play_background_color = "#10121AFF"

# 音符尺寸大小（像素）
block_size = 210

# 背景图像设定 (0=无, 1=默认)
background_image_preset = 0

# 背景闪光颜色（RGBA）
background_image_flash_color = "#FFFFFF00"

# 背景最低亮度 (0.0-1.0)
# 背景遮罩颜色（RGBA）
background_dim_color = "#000000FF"


# 轨道光效宽度模式 (0=跟随音符宽度, 1=跟随轨道间距)
beam_width_mode = 0

# 判定线粗细（像素）
judge_line_thickness = 2

# 是否连接所有并排的点块 (0=关闭, 1=开启)
generate_short_connect = 1

# 是否连接上下相邻的滑块 (0=关闭, 1=开启)
generate_instant_connect = 1

# 被连接音符的最大时间差（秒）
instant_connect_max_time = 0.5
