# 粒子包配置文件
# 目录结构：Particles/<包名>/ 下放 particle.ini + 若干精灵图
# 精灵图为序列帧 spritesheet（单帧为正方形，帧间按行从左到右排列）
# [base] 节声明基础粒子精灵图（游戏「基础粒子」下拉选择此包时播放）
# [emitter] 节声明发射器/散射粒子精灵图（游戏「散射粒子」下拉选择此包时播放）
# 一个包可同时声明 [base] 与 [emitter]（复合粒子包）
# 节内 file 键可声明多张精灵图（英文逗号分隔），播放时随机选取其中一张
# 节内 rotation 键可声明随机旋转角度（[a,b,c] 离散集 / a,b 连续范围 / 单值固定，缺省不旋转）

[general]
# 单帧像素边长（必须 >0，否则视为无效粒子包）
size=256
# 总帧数（可选。缺省 = cols*rows 即整个网格；超出网格可用帧会被截断）
frame=64
# 每秒帧率（播放时按此间隔推进帧，帧率驱动不跳帧）
fps=120
# 网格列数/行数（可选。缺省按 贴图尺寸/单帧尺寸 推导，显式声明可避免整除误差）
cols=8
rows=8
# 是否循环播放（false=播完一次后消失）
loop=false
# 是否在播放末尾淡出（true=播放进度 >60% 后透明度渐降到 0）
fade_out=false

[emitter]
file=base.png
# 随机旋转角度：连续范围 0-360（每次播放抽一次，整段动画固定该角）
rotation=0,360
