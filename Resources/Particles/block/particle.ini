# 粒子包配置文件
# 目录结构：Particles/<包名>/ 下放 particle.ini + 若干精灵图
# 精灵图为序列帧 spritesheet（单帧为正方形，帧间按行从左到右排列）

[general]
# 单帧像素边长（必须 >0，否则视为无效粒子包）
size=384
# 总帧数（可选。缺省 = cols*rows 即整个网格；超出网格可用帧会被截断）
frame=60
# 每秒帧率（播放时按此间隔推进帧，帧率驱动不跳帧）
fps=120
# 网格列数/行数（可选。缺省按 贴图尺寸/单帧尺寸 推导，显式声明可避免整除误差）
cols=6
rows=10
# 是否循环播放（false=播完一次后消失）
loop=false
# 是否在播放末尾淡出（true=播放进度 >60% 后透明度渐降到 0）
fade_out=false

# 各判定类型使用的精灵图（任一判定可省略，播放器会回退到 Perfect→Great→Good→Bad 顺序）
[perfect]
file=block.png
[great]
file=block.png
[good]
file=block.png
[bad]
file=block.png
