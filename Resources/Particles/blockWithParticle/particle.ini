# 粒子包配置文件
# 目录结构：Particles/<包名>/ 下放 particle.ini + 若干精灵图
# 精灵图为序列帧 spritesheet（单帧为正方形，帧间按行从左到右排列）
# [perfect]/[great]/[good]/[bad] 节的 file 键可声明多张精灵图（英文逗号分隔），
# 播放时随机选取其中一张，用于表现「同一判定下发射规律随机轮换」的粒子
# 节内还可叠加声明粒子动画（把多张动画按帧叠加组合成新动画，省去预渲染组合图）：
#   particle=一张或多张叠加精灵图（需与基础动画同帧率/帧数，叠加层与其同步推进帧）
#   particle_scaling=叠加粒子显示尺寸相对基础的百分比（100=与基础等大）
#   particle_rotation=叠加粒子绘制时的随机旋转角度（每次播放抽一次，整段动画固定该角）：
#     [a,b,c] 离散集（每次播放从列出的角度随机取一个）
#     a,b     连续范围（min,max 之间随机）
#     45      固定角度
#     空/省略 不旋转

[general]
# 单帧像素边长（必须 >0，否则视为无效粒子包）
size=256
# 总帧数（可选。缺省 = cols*rows 即整个网格；超出网格可用帧会被截断）
frame=64
# 每秒帧率（播放时按此间隔推进帧，帧率驱动不跳帧）
fps=120
# 网格列数/行数（可选。缺省按 贴图尺寸/单帧尺寸 推导，显式声明可避免整除误差）
cols=8
rows=8
# 是否循环播放（false=播完一次后消失）
loop=false
# 是否在播放末尾淡出（true=播放进度 >60% 后透明度渐降到 0）
fade_out=false

# 各判定类型使用的精灵图（任一判定可省略，播放器会回退到 Perfect→Great→Good→Bad 顺序）
# file 逗号分隔多张图时，每次播放随机选一张
# Perfect 保持多图随机；Great/Good/Bad 用 BlockG 基础 + ParticleG 叠加（等大、0-360° 随机旋转）
[perfect]
file=BlockAndParticleP1.png, BlockAndParticleP2.png, BlockAndParticleP3.png, BlockAndParticleP4.png, BlockAndParticleP5.png
[great]
file=BlockG.png
particle=ParticleG.png
particle_scaling=100
particle_rotation=0,360
[good]
file=BlockG.png
particle=ParticleG.png
particle_scaling=100
particle_rotation=0,360
[bad]
file=BlockG.png
particle=ParticleG.png
particle_scaling=100
particle_rotation=0,360
