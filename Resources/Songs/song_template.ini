# 歌曲数据配置模板
# 用于描述自定义歌曲/MIDI的元数据

# 歌曲基本信息
[song_info]
name = ""                          # 歌曲名称（必需）
artist = ""                        # 作曲者（必需）
album = ""                         # 所属专辑
duration = 0                       # 歌曲时长（秒）

# 谱面信息
[chart_info]
title = ""                         # 谱面名称
difficulty = "Normal"              # 难度等级
creator = ""                       # 谱面设计者
version = "1.0"                    # 谱面版本

# 音频文件
[audio]
path = "music.ogg"                # 相对于该歌曲目录的音频文件路径
offset = 0                         # 音频偏移（毫秒）
bpm = 120                          # 节拍速率

# 背景和视觉
[visual]
background = "background.png"      # 背景图片
cover = "cover.jpg"               # 封面图片
preview_start = 0                 # 预览开始位置（秒）

# MIDI文件（如果使用）
[midi]
path = "chart.mid"                # MIDI文件路径
format = "type0"                  # MIDI格式：type0, type1
notes_track = 0                   # 音符所在轨道

# 标签和分类
[metadata]
tags = []                          # 标签列表（JSON数组）
enabled = true                     # 是否启用此谱面
